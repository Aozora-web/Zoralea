<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoralea</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="night-mode">

    <div id="particles-background"></div>

    <div id="login-screen" class="active">
        <div class="floating-elements" id="login-particles"></div>
        <div class="login-box glass-effect">
            <h2>Ruang Kata Kita</h2>
            <p>Ruang rahasia untuk menuangkan rasa.</p>
            <input type="password" id="passcode" placeholder="Masukkan passwordnya yaa">
            <button class="btn-primary" onclick="handleLogin()">Masuk Kebersamaan</button>
            <p id="login-error">Kamu bukan pemilik ruangan ini.</p>
        </div>
    </div>
    
    <div id="main-app">
        <button class="mode-toggle glass-effect" onclick="toggleTimeMode()" id="mode-btn">🌙 Mode Malam</button>

        <header>
            <h1 class="glowing-title">Ruang Kata Kita</h1>
            <p class="subtitle">Ruang ini untukmu, <span id="user-display"></span> >_<</p>
            <button onclick="handleLogout()" class="btn-logout">Tutup Ruangan</button>
        </header>

        <main id="poems-container">
            </main>

        <button class="fab btn-primary" onclick="openPoemModal()">+ Tulis Perasaan</button>
    </div>

    <div id="view-modal" class="modal">
        <div class="modal-content glass-effect" id="view-modal-content">
            <span class="close" onclick="closeViewModal()">&times;</span>
            <h2 id="view-title"></h2>
            <div id="view-content"></div>
            <div class="poem-meta">
                <span>Ditulis oleh: <b id="view-author"></b></span>
                <small id="view-date"></small>
            </div>
        </div>
    </div>

    <div id="poem-modal" class="modal">
        <div class="modal-content text-mode glass-effect">
            <span class="close text-dark" onclick="closePoemModal()">&times;</span>
            <h2 id="modal-heading" class="modal-title">Goreskan Tintamu</h2>
            <input type="hidden" id="poem-id">
            <input type="text" id="poem-title" class="input-styled" placeholder="Berikan Judul Emosimu...">
            <textarea id="poem-content" class="input-styled" rows="5" placeholder="Ketik kata-kata manis atau puisimu di sini..."></textarea>
            
            <div class="theme-selector">
                <p>Pilih Suasana Template Kartu:</p>
                <div class="themes-grid">
                    <div class="theme-opt theme-senja" onclick="changeSelectedTheme('theme-senja')">🌅</div>
                    <div class="theme-opt theme-malam" onclick="changeSelectedTheme('theme-malam')">🌌</div>
                    <div class="theme-opt theme-fajar" onclick="changeSelectedTheme('theme-fajar')">🌤️</div>
                    <div class="theme-opt theme-aurora" onclick="changeSelectedTheme('theme-aurora')">🎆</div>
                    <div class="theme-opt theme-laut" onclick="changeSelectedTheme('theme-laut')">🌊</div>
                    <div class="theme-opt theme-kucing" onclick="changeSelectedTheme('theme-kucing')">🐱</div>
                    <div class="theme-opt theme-bunga" onclick="changeSelectedTheme('theme-bunga')">🌸</div>
                    <div class="theme-opt theme-hujan" onclick="changeSelectedTheme('theme-hujan')">🌧️</div>
                    <div class="theme-opt theme-kertas" onclick="changeSelectedTheme('theme-kertas')">📜</div>
                    <div class="theme-opt theme-daun" onclick="changeSelectedTheme('theme-daun')">🌿</div>
                    <div class="theme-opt theme-kopi" onclick="changeSelectedTheme('theme-kopi')">☕</div>
                    <div class="theme-opt theme-bintang" onclick="changeSelectedTheme('theme-bintang')">⭐</div>
                    <div class="theme-opt theme-hati" onclick="changeSelectedTheme('theme-hati')">💖</div>
                    <div class="theme-opt theme-kupu" onclick="changeSelectedTheme('theme-kupu')">🦋</div>
                    <div class="theme-opt theme-musik" onclick="changeSelectedTheme('theme-musik')">🎵</div>
                </div>
            </div>
            
            <button onclick="handleSavePoem()" class="btn-primary" style="margin-top: 20px; width: 100%;">Simpan ke Dalam Hati</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
